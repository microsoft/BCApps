test_setup: TMA-Setup.yaml

tests:
  - name: JC1-CountryRegion
    description: New jurisdiction gets Country/Region from order Ship-to
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
      taxJurisdictions: []
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: NEW YORK STATE TAX
              ratePct: 4.0
              channelLiable: false
    expected:
      allTaxLinesMatched: true
      createdJurisdictionCountryRegion: US
      matchResult: true

  - name: JC2-ReportToMultiple
    description: 3 jurisdictions created; all get Report-to = first (state-level)
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
      taxJurisdictions: []
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: NEW YORK STATE TAX
              ratePct: 4.0
              channelLiable: false
            - lineNo: 2
              title: NEW YORK CITY TAX
              ratePct: 4.5
              channelLiable: false
            - lineNo: 3
              title: MTA SURCHARGE
              ratePct: 0.375
              channelLiable: false
    expected:
      allTaxLinesMatched: true
      reportToAllSame: true
      matchResult: true

  - name: JC3-ReportToSingle
    description: Only 1 jurisdiction matched — FixReportToJurisdictions not called (guard Count > 1)
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
      taxJurisdictions: []
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: NEW YORK STATE TAX
              ratePct: 4.0
              channelLiable: false
    expected:
      allTaxLinesMatched: true
      matchResult: true

  - name: JC4-JurisdictionAlreadyExists
    description: Jurisdiction already exists — LLM should match to it, not create new
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
      taxJurisdictions:
        - Code: NYSTAX
          Description: Admin-maintained New York State Tax
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: NEW YORK STATE TAX
              ratePct: 4.0
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: NYSTAX
      taxJurisdictionDescriptions:
        - code: NYSTAX
          description: Admin-maintained New York State Tax
      matchResult: true

  - name: JC5-DescriptionMatchesTaxTitle
    description: Auto-created jurisdiction's Description uses the full Shopify tax title
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
      taxJurisdictions: []
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: METROPOLITAN COMMUTER TRANSPORTATION MOBILITY TAX
              ratePct: 4.0
              channelLiable: false
    expected:
      allTaxLinesMatched: true
      createdJurisdictionDescriptionMatchesTitle: true
      matchResult: true

  - name: JC6-CanadianHSTUsesProvinceCode
    description: Generic Canadian HST auto-creation uses a province-specific jurisdiction
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
        autoCreateTaxAreas: true
      taxJurisdictions: []
      orderAddress:
        countryRegionCode: CA
        county: ON
        city: Toronto
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: HST
              ratePct: 13.0
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: ONHST
      taxJurisdictionDescriptions:
        - code: ONHST
          description: HST - ON
      createdJurisdictionCountryRegion: CA
      rateConflict: false
      matchResult: true

  - name: JC7-CanadianHSTDoesNotReuseAgentGeneric
    description: A generic agent-created HST jurisdiction is not reused for a different province and rate
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
        autoCreateTaxAreas: true
      taxJurisdictions:
        - Code: HST
          Description: HST
          Country/Region Code: CA
          Created by Agent: true
      existingTaxDetails:
        - Tax Jurisdiction Code: HST
          Tax Group Code: TAXABLE
          Tax Below Maximum: 13.0
          Effective Date: "2026-09-24"
      orderAddress:
        countryRegionCode: CA
        county: NS
        city: Halifax
      documentDate: "2026-09-24"
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: HST
              ratePct: 14.0
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: NSHST
      taxJurisdictionDescriptions:
        - code: NSHST
          description: HST - NS
      taxDetailExists:
        - taxGroupCode: TAXABLE
          ratePct: 14.0
      rateConflict: false
      matchResult: true
