test_setup: TMA-Setup.yaml

tests:
  - name: CA-ON-real
    description: "ON real Shopify tax lines (HST) match reworded BC jurisdictions"
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: ONHST
          Description: Ontario Harmonized Sales Tax
          Country/Region Code: CA
      orderAddress:
        countryRegionCode: CA
        county: ON
        city: Toronto
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "HST"
              ratePct: 13.0
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "ONHST"

