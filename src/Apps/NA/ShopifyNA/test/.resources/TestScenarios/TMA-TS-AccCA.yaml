test_setup: TMA-Setup.yaml

tests:
  - name: CA-ON-01-exact
    description: "ON primary jurisdiction via exact title must match ONHST"
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: ONHST
          Description: Ontario HST
          Country/Region Code: CA
      orderAddress:
        countryRegionCode: CA
        county: ON
        city: Toronto
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "ONTARIO HST"
              ratePct: 13.0
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "ONHST"

