test_setup: TMA-Setup.yaml

tests:
  - name: US-NY-01-exact
    description: "NY primary jurisdiction via exact title must match NYSTAX"
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: NYSTAX
          Description: New York State Tax
          Country/Region Code: US
        - Code: NYCTAX
          Description: New York City Tax
          Country/Region Code: US
        - Code: MTATAX
          Description: MTA Surcharge
          Country/Region Code: US
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "NEW YORK STATE TAX"
              ratePct: 4.0
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "NYSTAX"

