test_setup: TMA-Setup.yaml

tests:
  - name: US-NC-01-exact
    description: "NC primary jurisdiction via exact title must match NCSTAX"
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: NCSTAX
          Description: North Carolina State Tax
          Country/Region Code: US
        - Code: NCMECK
          Description: Mecklenburg County Tax
          Country/Region Code: US
      orderAddress:
        countryRegionCode: US
        county: NC
        city: Charlotte
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "NC STATE TAX"
              ratePct: 4.75
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "NCSTAX"

