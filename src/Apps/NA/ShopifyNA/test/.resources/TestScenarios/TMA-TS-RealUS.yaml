test_setup: TMA-Setup.yaml

tests:
  - name: US-CA-LosAngeles-real
    description: "Los Angeles, CA real Shopify tax lines match reworded BC jurisdictions"
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: CASUT
          Description: California Sales and Use Tax
          Country/Region Code: US
        - Code: LACNTY
          Description: LA County District Tax
          Country/Region Code: US
        - Code: LACITY
          Description: City of Los Angeles
          Country/Region Code: US
      orderAddress:
        countryRegionCode: US
        county: CA
        city: Los Angeles
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "California State Tax"
              ratePct: 6.0
              channelLiable: false
        - lineId: 10002
          taxLines:
            - lineNo: 1
              title: "Los Angeles County Tax"
              ratePct: 0.25
              channelLiable: false
        - lineId: 10003
          taxLines:
            - lineNo: 1
              title: "Los Angeles City Tax"
              ratePct: 2.75
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "CASUT"
        - parentId: 10002
          lineNo: 1
          jurisdictionCode: "LACNTY"
        - parentId: 10003
          lineNo: 1
          jurisdictionCode: "LACITY"

  - name: US-CA-LosAngeles-state
    description: "CA state-only Shopify tax line matches the state jurisdiction"
