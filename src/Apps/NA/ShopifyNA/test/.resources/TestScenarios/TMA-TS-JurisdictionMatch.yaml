test_setup: TMA-Setup.yaml

tests:
  - name: J1-ExactMatchAllLines
    description: All tax lines match existing jurisdictions with high confidence
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: NYSTAX
          Description: New York State Tax
        - Code: NYCTAX
          Description: New York City Tax
        - Code: MTATAX
          Description: MTA Surcharge
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: NEW YORK STATE TAX
              ratePct: 4.0
              channelLiable: false
            - lineNo: 2
              title: NEW YORK CITY TAX
              ratePct: 4.5
              channelLiable: false
            - lineNo: 3
              title: MTA SURCHARGE
              ratePct: 0.375
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: NYSTAX
        - parentId: 10001
          lineNo: 2
          jurisdictionCode: NYCTAX
        - parentId: 10001
          lineNo: 3
          jurisdictionCode: MTATAX
      matchResult: true

  - name: J2-PartialMatchNoAutoCreate
    description: Some lines match, others don't; auto-create disabled so unmatched are skipped
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
      taxJurisdictions:
        - Code: NYSTAX
          Description: New York State Tax
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: NEW YORK STATE TAX
              ratePct: 4.0
              channelLiable: false
            - lineNo: 2
              title: NEW YORK CITY TAX
              ratePct: 4.5
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: NYSTAX
      matchResult: true

  - name: J3-PartialMatchAutoCreate
    description: Some lines match, unmatched get auto-created
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: true
      taxJurisdictions:
        - Code: NYSTAX
          Description: New York State Tax
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
      orderLines:
        - lineId: 10001
          itemNo: ITEM001
          taxGroupCode: TAXABLE
          taxLines:
            - lineNo: 1
              title: NEW YORK STATE TAX
              ratePct: 4.0
              channelLiable: false
            - lineNo: 2
              title: NEW YORK CITY TAX
              ratePct: 4.5
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: NYSTAX
        - parentId: 10001
          lineNo: 2
          hasJurisdictionCode: true
      matchResult: true

  - name: J4-NoMatchNoAutoCreate
    description: All lines unmatched; auto-create disabled, all skipped
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
      taxJurisdictions: []
      orderAddress:
        countryRegionCode: US
        county: NY
        city: New York
