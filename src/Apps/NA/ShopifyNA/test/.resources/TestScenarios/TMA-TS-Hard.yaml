test_setup: TMA-Setup.yaml

tests:
  - name: HARD-Homonym-WashingtonCounty-OR
    description: "Hard - Washington County exists in many states; ship-to Oregon must pick the Oregon one"
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: ORWASHCO
          Description: Washington County Oregon
          Country/Region Code: US
        - Code: UTWASHCO
          Description: Washington County Utah
          Country/Region Code: US
        - Code: PAWASHCO
          Description: Washington County Pennsylvania
          Country/Region Code: US
        - Code: MNWASHCO
          Description: Washington County Minnesota
          Country/Region Code: US
        - Code: ARWASHCO
          Description: Washington County Arkansas
          Country/Region Code: US
      orderAddress:
        countryRegionCode: US
        county: OR
        city: Beaverton
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "Washington County Tax"
              ratePct: 0.5
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "ORWASHCO"

  - name: HARD-Geo-KansasCity-Missouri
    description: "Hard - Kansas City is in Missouri; a Kansas City order must not match a Kansas jurisdiction"
    setup:
      shopSettings:
        autoCreateTaxJurisdictions: false
        autoCreateTaxAreas: true
        taxAreaNamingPattern: SHPFY-
      taxJurisdictions:
        - Code: MOKC
          Description: Kansas City Missouri Tax
          Country/Region Code: US
        - Code: KSKC
          Description: Kansas City Kansas Tax
          Country/Region Code: US
        - Code: KSSTATE
          Description: Kansas State Sales Tax
          Country/Region Code: US
        - Code: MOSTATE
          Description: Missouri State Sales Tax
          Country/Region Code: US
      orderAddress:
        countryRegionCode: US
        county: MO
        city: Kansas City
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "Missouri State Tax"
              ratePct: 4.225
              channelLiable: false
        - lineId: 10002
          taxLines:
            - lineNo: 1
              title: "Kansas City Tax"
              ratePct: 3.25
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "MOSTATE"
        - parentId: 10002
          lineNo: 1
          jurisdictionCode: "MOKC"

