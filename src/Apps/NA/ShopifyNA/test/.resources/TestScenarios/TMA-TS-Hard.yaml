        city: Topeka
      orderLines:
        - lineId: 10001
          taxLines:
            - lineNo: 1
              title: "Kansas State Tax"
              ratePct: 6.5
              channelLiable: false
    expected:
      taxLineJurisdictions:
        - parentId: 10001
          lineNo: 1
          jurisdictionCode: "KSSUT"

