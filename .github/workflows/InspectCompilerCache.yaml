name: Export complete compiler cache

on:
  pull_request:
    branches: [ 'releases/28.x' ]
    paths:
      - '.github/workflows/InspectCompilerCache.yaml'

permissions:
  actions: read
  contents: read

jobs:
  ListCache:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'aholstrup1-inspect-compiler-cache-contents'
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      CACHE_KEY: https://bcinsider-fvh2ekdjecfjd6gk.b02.azurefd.net/sandbox/28.7.57360.0/base
      CACHE_VERSION: 2da07c0904e89864440f98729f68f9db99a2fe86650d85420f68322322c0670c
    steps:
      - name: Verify exact cache identity and compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          CACHE_PATH: ${{ runner.temp }}/.artifactcache
          LISTING_PATH: ${{ runner.temp }}\compiler-cache-listing
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RUNNER_OS -ne 'Windows') { throw 'The cache requires Windows.' }
          zstd --version
          if ($LASTEXITCODE -ne 0) { throw 'The producer requires zstd compression.' }
          $versionInput = "$($env:CACHE_PATH)|zstd-without-long|windows-only|1.0"
          $version = [Convert]::ToHexString([System.Security.Cryptography.SHA256]::HashData([System.Text.Encoding]::UTF8.GetBytes($versionInput))).ToLowerInvariant()
          if ($version -cne $env:CACHE_VERSION) { throw "Cache path/compression version mismatch: $version" }

          $query = [uri]::EscapeDataString($env:CACHE_KEY)
          $response = gh api "repos/$env:GITHUB_REPOSITORY/actions/caches?key=$query&per_page=100"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot verify cache metadata.' }
          $caches = $response | ConvertFrom-Json
          if ($caches.total_count -gt 100) { throw 'Cache query exceeds one page; refusing ambiguous identity.' }
          $matches = @($caches.actions_caches | Where-Object { $_.key -ceq $env:CACHE_KEY -and $_.version -ceq $env:CACHE_VERSION })
          if ($matches.Count -ne 1) { throw 'Expected exactly one cache with the pinned key and version.' }
          $cache = $matches[0]
          if ($cache.id -ne 9849354071 -or $cache.ref -cne 'refs/heads/releases/28.x' -or $cache.size_in_bytes -ne 899720052) {
            throw 'The cache identity, branch, or stored archive size changed.'
          }
          if (Test-Path -LiteralPath $env:CACHE_PATH) { throw 'Restore destination is not empty.' }
          New-Item -ItemType Directory -Path $env:LISTING_PATH | Out-Null
          $cache | ConvertTo-Json | Set-Content -LiteralPath "$env:LISTING_PATH\cache-metadata.json" -Encoding utf8

      - name: Look up exact existing cache without downloading
        id: lookup
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.artifactcache
          key: ${{ env.CACHE_KEY }}
          enableCrossOsArchive: false
          fail-on-cache-miss: true
          lookup-only: true

      - name: Reject a partial match
        env:
          CACHE_HIT: ${{ steps.lookup.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.lookup.outputs.cache-matched-key }}
        run: |
          if ($env:CACHE_HIT -cne 'true' -or $env:MATCHED_KEY -cne $env:CACHE_KEY) {
            throw 'Exact cache not found. No download or repopulation will be attempted.'
          }

      - name: Restore existing cache only
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.artifactcache
          key: ${{ env.CACHE_KEY }}
          enableCrossOsArchive: false
          fail-on-cache-miss: true

      - name: Export relative filenames and byte lengths only
        env:
          CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}
          MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
          CACHE_PATH: ${{ runner.temp }}/.artifactcache
          LISTING_PATH: ${{ runner.temp }}\compiler-cache-listing
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:CACHE_HIT -cne 'true' -or $env:MATCHED_KEY -cne $env:CACHE_KEY) {
            throw 'The restored cache is not an exact match.'
          }
          $root = Get-Item -LiteralPath $env:CACHE_PATH -Force
          if (-not $root.PSIsContainer -or ($root.Attributes -band [IO.FileAttributes]::ReparsePoint)) {
            throw 'Expected an ordinary cache directory.'
          }
          $entries = @(Get-ChildItem -LiteralPath $root.FullName -Recurse -Force -ErrorAction Stop)
          if (@($entries | Where-Object { $_.Attributes -band [IO.FileAttributes]::ReparsePoint }).Count) {
            throw 'Cache contains links; refusing an incomplete or externally resolved listing.'
          }
          $files = @($entries | Where-Object { -not $_.PSIsContainer } | ForEach-Object {
            [pscustomobject]@{
              RelativePath = [IO.Path]::GetRelativePath($root.FullName, $_.FullName)
              Bytes = [long]$_.Length
            }
          } | Sort-Object RelativePath)
          if ($files.Count -eq 0) { throw 'The cache has no files.' }
          $files | Export-Csv -LiteralPath "$env:LISTING_PATH\files.csv" -NoTypeInformation -Encoding utf8
          $folders = @($files | Group-Object { ($_.RelativePath -split '\\')[0] } | ForEach-Object {
            [pscustomobject]@{ Name = $_.Name; Files = $_.Count; Bytes = [long](($_.Group | Measure-Object Bytes -Sum).Sum) }
          } | Sort-Object Bytes -Descending)
          $extensions = @($files | Group-Object { [IO.Path]::GetExtension($_.RelativePath).ToLowerInvariant() } | ForEach-Object {
            [pscustomobject]@{ Extension = $_.Name; Files = $_.Count; Bytes = [long](($_.Group | Measure-Object Bytes -Sum).Sum) }
          } | Sort-Object Bytes -Descending)
          $summary = [ordered]@{
            CacheId = 9849354071
            Key = $env:CACHE_KEY
            Version = $env:CACHE_VERSION
            CacheRef = 'refs/heads/releases/28.x'
            StoredArchiveBytes = 899720052
            FileCount = $files.Count
            UncompressedFileBytes = [long](($files | Measure-Object Bytes -Sum).Sum)
            DirectoryCount = @($entries | Where-Object PSIsContainer).Count
            TopLevelEntries = $folders
            Extensions = $extensions
            Repository = $env:GITHUB_REPOSITORY
            RunUrl = "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
            RunAttempt = $env:GITHUB_RUN_ATTEMPT
            Job = $env:GITHUB_JOB
            WorkflowSha = $env:GITHUB_SHA
            EnumeratedAtUtc = [DateTime]::UtcNow.ToString('o')
            Scope = 'Full restored cache exported as a lossless ZIP repack; not the original GitHub cache blob.'
          }
          $summary | ConvertTo-Json -Depth 6 | Set-Content -LiteralPath "$env:LISTING_PATH\summary.json" -Encoding utf8
          "Files: $($summary.FileCount); uncompressed file bytes: $($summary.UncompressedFileBytes); stored archive bytes: $($summary.StoredArchiveBytes)." |
            Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY

      - name: Archive and verify every cached file
        shell: python
        env:
          CACHE_PATH: ${{ runner.temp }}/.artifactcache
          LISTING_PATH: ${{ runner.temp }}\compiler-cache-listing
        run: |
          import csv
          import hashlib
          import json
          import os
          import re
          import zipfile
          from pathlib import Path

          root = Path(os.environ["CACHE_PATH"])
          output = Path(os.environ["LISTING_PATH"])
          with (output / "files.csv").open(encoding="utf-8-sig", newline="") as stream:
              listing = {row["RelativePath"]: int(row["Bytes"]) for row in csv.DictReader(stream)}
          if len(listing) != 3632 or sum(listing.values()) != 1748675550:
              raise RuntimeError("The restored cache differs from the previously verified listing.")
          suspicious = re.compile(
              r"(?i)(^|[\\/])(\.env(?:\..*)?|credentials(?:\..*)?|secrets(?:\..*)?|"
              r"id_(?:rsa|ed25519)|.*\.(?:pfx|p12|pem|key|snk|flf|bclicense))$"
          )
          entries = sorted(root.rglob("*"))
          flagged = [str(path.relative_to(root)) for path in entries if suspicious.search(str(path.relative_to(root)))]
          if flagged:
              raise RuntimeError("Potential credential/license files require review before export: " + repr(flagged))
          directories = [path for path in entries if path.is_dir()]
          files = [path for path in entries if path.is_file()]
          actual = {str(path.relative_to(root)): path.stat().st_size for path in files}
          if actual != listing or len(directories) != 231:
              raise RuntimeError("Archive input does not match the complete file/directory listing.")

          def digest(stream):
              value = hashlib.sha256()
              for block in iter(lambda: stream.read(1024 * 1024), b""):
                  value.update(block)
              return value.hexdigest()

          manifest = []
          archive_path = output / "compiler-cache-9849354071.zip"
          with zipfile.ZipFile(archive_path, "w", compression=zipfile.ZIP_DEFLATED, compresslevel=6, allowZip64=True) as archive:
              for path in directories:
                  archive.write(path, path.relative_to(root).as_posix() + "/")
              for path in files:
                  relative = path.relative_to(root).as_posix()
                  with path.open("rb") as stream:
                      sha256 = digest(stream)
                  archive.write(path, relative)
                  manifest.append({"path": relative, "bytes": path.stat().st_size, "sha256": sha256})

          with zipfile.ZipFile(archive_path) as archive:
              names = archive.namelist()
              expected = {entry["path"] for entry in manifest}
              expected.update(path.relative_to(root).as_posix() + "/" for path in directories)
              if len(names) != len(expected) or set(names) != expected:
                  raise RuntimeError("ZIP entry set differs from restored cache.")
              for entry in manifest:
                  if archive.getinfo(entry["path"]).file_size != entry["bytes"]:
                      raise RuntimeError("ZIP file length mismatch: " + entry["path"])
                  with archive.open(entry["path"]) as stream:
                      if digest(stream) != entry["sha256"]:
                          raise RuntimeError("ZIP content hash mismatch: " + entry["path"])
          with archive_path.open("rb") as stream:
              archive_sha256 = digest(stream)
          (output / "file-sha256.json").write_text(json.dumps(manifest, indent=2), encoding="utf-8")
          metadata = {
              "archive": archive_path.name,
              "bytes": archive_path.stat().st_size,
              "sha256": archive_sha256,
              "files": len(files),
              "directories": len(directories),
              "uncompressed_file_bytes": sum(listing.values()),
              "format": "Lossless ZIP repack of the complete restored cache; not the original GitHub cache blob.",
              "verification": "Every ZIP file's SHA256 and length match the restored source; directory entries include empty directories.",
              "filename_screening": "No credential/private-key/business-license filenames detected; package license notices and authentication libraries are retained.",
          }
          (output / "archive-metadata.json").write_text(json.dumps(metadata, indent=2), encoding="utf-8")
          print(json.dumps(metadata, indent=2))

      - name: Upload full cache archive and verification metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compiler-cache-full
          path: |
            ${{ runner.temp }}\compiler-cache-listing\compiler-cache-9849354071.zip
            ${{ runner.temp }}\compiler-cache-listing\file-sha256.json
            ${{ runner.temp }}\compiler-cache-listing\archive-metadata.json
            ${{ runner.temp }}\compiler-cache-listing\files.csv
            ${{ runner.temp }}\compiler-cache-listing\cache-metadata.json
            ${{ runner.temp }}\compiler-cache-listing\summary.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
