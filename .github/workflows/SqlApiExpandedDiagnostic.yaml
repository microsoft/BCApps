name: 'DRAFT expanded API sealed reuse comparison - DO NOT MERGE'
on:
  workflow_call:
    inputs:
      authorization:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      authorization:
        description: 'Parent must review source and reserve two allocations before selecting reviewed-originals'
        required: true
        type: choice
        default: HOLD
        options:
          - HOLD
          - reviewed-originals
permissions:
  actions: read
  contents: read
  id-token: write
  packages: read
concurrency:
  group: sql-api-653393-expanded-api-diagnostic
  cancel-in-progress: false
jobs:
  Plan:
    if: github.repository == 'microsoft/BCApps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/features/653393-expanded-api-reuse-successor' && github.run_attempt == 1 && inputs.authorization == 'reviewed-originals'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Declare complete bounded comparison
        id: plan
        shell: pwsh
        run: .\build\scripts\ExpandedApiDiagnostic\Plan.ps1 -OutputDirectory expanded-api-plan
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-api-plan-${{ github.run_id }}
          path: expanded-api-plan/*.json
          if-no-files-found: error
          retention-days: 14
  Registry:
    needs: Plan
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      id: ${{ steps.adopt.outputs.id }}
      digest: ${{ steps.adopt.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          fetch-depth: 0
      - name: Adopt exact terminal producer registry without compiling or relabeling packages
        id: adopt
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\build\scripts\ExpandedApiDiagnostic\Adopt.ps1
      - name: Preserve consumer adoption and unchanged producer manifests
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-adoption-${{ github.run_id }}
          path: expanded-adoption/**
          if-no-files-found: error
          retention-days: 14
  Trials:
    needs: [Plan, Registry]
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.Plan.outputs.matrix) }}
    uses: ./.github/workflows/_ExpandedApiCell.yaml
    secrets: inherit
    with:
      country: ${{ matrix.country }}
      config: ${{ matrix.config }}
      lanes: ${{ toJSON(matrix.lanes) }}
      registryId: ${{ needs.Registry.outputs.id }}
      registryDigest: ${{ needs.Registry.outputs.digest }}
  Audit:
    needs: [Plan, Registry, Trials]
    if: always() && needs.Plan.result == 'success'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify every original lane and compare exact cohorts across topologies
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BC_EXPANDED_REGISTRY_RESULT: ${{ needs.Registry.result }}
          BC_EXPANDED_TRIALS_RESULT: ${{ needs.Trials.result }}
        run: .\build\scripts\ExpandedApiDiagnostic\Audit.ps1
      - name: Preserve comparison including failures and unsupported variants
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: expanded-audit-${{ github.run_id }}
          path: expanded-audit/*.json
          if-no-files-found: error
          retention-days: 14
