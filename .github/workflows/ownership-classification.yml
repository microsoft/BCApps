name: Team Ownership Classification

# Ownership: Manual means a human pinned the team; automation must not overwrite it.
# Ownership: Needs Review means the automated result was Other or low confidence.
on:
  issues:
    types: [opened, reopened, labeled, unlabeled]
  pull_request_target:
    types: [opened, reopened, ready_for_review, labeled, unlabeled]
  workflow_dispatch:
    inputs:
      subject_kind:
        description: issue or pull_request
        required: true
        type: choice
        options:
          - issue
          - pull_request
      subject_number:
        description: Issue or pull request number
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: ownership-${{ inputs.subject_kind || (github.event_name == 'issues' && 'issue') || 'pull_request' }}-${{ inputs.subject_number || github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

env:
  AGENT_REPO: microsoft/BCAppsTriage
  AGENT_REPO_NAME: BCAppsTriage
  AGENT_REF: main
  AGENT_WORKFLOW: ownership-classification.yml
  SUBJECT_KIND: ${{ inputs.subject_kind || (github.event_name == 'issues' && 'issue') || 'pull_request' }}
  SUBJECT_NUMBER: ${{ inputs.subject_number || github.event.issue.number || github.event.pull_request.number }}

jobs:
  classify:
    name: Classify team ownership
    if: >-
      github.repository == 'microsoft/BCApps' && (
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        ) ||
        (
          (
            github.event_name == 'issues' && github.event.issue.state == 'open' ||
            github.event_name == 'pull_request_target' && github.event.pull_request.state == 'open'
          ) && (
            !contains(fromJSON('["labeled","unlabeled"]'), github.event.action) ||
            github.event.label.name == 'Ownership: Manual' ||
            startsWith(github.event.label.name, 'Team: ')
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: triage
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - name: Check labels and manual override
        id: preflight
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          SUBJECT_KIND: ${{ env.SUBJECT_KIND }}
          SUBJECT_NUMBER: ${{ env.SUBJECT_NUMBER }}
        with:
          script: |
            // The team taxonomy belongs to the repository's label set, not to
            // this workflow. It is DISCOVERED from the "Team: " namespace, so
            // adding a team or renaming one is a label change with no code
            // change here. Hardcoding the list is what broke this workflow when
            // the labels were namespaced.
            const TEAM_LABEL_PREFIX = 'Team: ';
            // A floor, so that discovery finding nothing fails loudly rather
            // than quietly deciding the repository has no teams.
            const MIN_TEAM_LABELS = 2;
            // Semantic rules, not taxonomy: these mean something to this
            // workflow whichever teams happen to exist.
            const UNRESOLVED_TEAM = 'Other';
            const ownershipLabels = ['Ownership: Manual', 'Ownership: Needs Review'];

            // Compare team names loosely, so a cosmetic rename -- case,
            // punctuation, or the singular-to-plural change that turned
            // Integration into Integrations -- does not require BCAppsTriage to
            // redeploy in lockstep with this repository. A genuine rename to a
            // different word still needs the agent updated, and is rejected
            // here rather than guessed at.
            const normaliseTeam = value => String(value ?? '')
              .replace(/^team:\s*/i, '')
              .toLowerCase()
              .replace(/[^a-z0-9]/g, '')
              .replace(/s$/, '');

            const deriveTeams = repoLabels => {
              const labelNames = repoLabels
                .map(label => label.name)
                .filter(name => name.startsWith(TEAM_LABEL_PREFIX));
              if (labelNames.length < MIN_TEAM_LABELS) {
                throw new Error(
                  `Found ${labelNames.length} "${TEAM_LABEL_PREFIX}" label(s), expected at least ` +
                  `${MIN_TEAM_LABELS}. Team ownership labels are missing from this repository.`,
                );
              }
              const labelByTeam = new Map();
              const teamByNormalised = new Map();
              for (const label of labelNames) {
                const team = label.slice(TEAM_LABEL_PREFIX.length).trim();
                const key = normaliseTeam(team);
                // Emptiness is checked after normalising, not before: a label
                // like "Team: !!!" has a name but not a comparable one, and an
                // empty key would become a bucket that every unusable answer
                // -- null, "", [] -- silently normalises into.
                if (!key) {
                  throw new Error(`Label "${label}" has no usable team name after the prefix.`);
                }
                if (teamByNormalised.has(key)) {
                  throw new Error(
                    `Team labels "${teamByNormalised.get(key)}" and "${team}" are indistinguishable ` +
                    'once normalised, so the agent\'s answer would be ambiguous. Rename one.',
                  );
                }
                labelByTeam.set(team, label);
                teamByNormalised.set(key, team);
              }
              // The unresolved bucket is load-bearing -- it is what
              // "Ownership: Needs Review" keys off -- and discovery cannot
              // infer which team it is, so it is required by name. Without
              // this, deleting the label makes every unresolved answer look
              // like a malformed one from BCAppsTriage, and renaming it stops
              // anything being flagged for review without saying so.
              if (!teamByNormalised.has(normaliseTeam(UNRESOLVED_TEAM))) {
                throw new Error(
                  `No "${TEAM_LABEL_PREFIX}${UNRESOLVED_TEAM}" label exists; found ` +
                  `${[...labelByTeam.keys()].map(name => `"${name}"`).join(', ')}. This repository ` +
                  'needs that label for work the agent cannot attribute to a team.',
                );
              }
              return {
                teamLabelNames: [...labelByTeam.values()],
                labelFor: team => labelByTeam.get(team),
                canonicalTeam: value => teamByNormalised.get(normaliseTeam(value)) ?? null,
              };
            };

            const subjectKind = process.env.SUBJECT_KIND;
            const issue_number = Number(process.env.SUBJECT_NUMBER);
            const action = context.payload.action;
            const changedLabel = context.payload.label?.name;
            const subject = context.payload.issue || context.payload.pull_request;
            const currentLabels = (subject?.labels || []).map(label =>
              typeof label === 'string' ? label : label.name
            );
            const auditOnly = context.eventName !== 'workflow_dispatch' && (
              action === 'labeled' && changedLabel === 'Ownership: Manual' ||
              ['labeled', 'unlabeled'].includes(action) && changedLabel !== 'Ownership: Manual' &&
              currentLabels.includes('Ownership: Manual')
            );
            if (!Number.isSafeInteger(issue_number) || issue_number <= 0) {
              throw new Error('subject_number must be a positive integer');
            }
            if (!['issue', 'pull_request'].includes(subjectKind)) {
              throw new Error(`Unsupported subject kind: ${subjectKind}`);
            }

            const response = await github.rest.issues.get({ ...context.repo, issue_number });
            const actualKind = response.data.pull_request ? 'pull_request' : 'issue';
            if (actualKind !== subjectKind) {
              throw new Error(`#${issue_number} is ${actualKind}, not ${subjectKind}`);
            }
            if (response.data.state !== 'open') {
              throw new Error(`${subjectKind} #${issue_number} is not open`);
            }

            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 },
            );
            const available = new Set(repoLabels.map(label => label.name));
            const { teamLabelNames } = deriveTeams(repoLabels);
            const missing = ownershipLabels.filter(name => !available.has(name));
            if (missing.length) {
              throw new Error(`Provision required ownership labels before running automation: ${missing.join(', ')}`);
            }

            const getLabels = async () => (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...context.repo, issue_number, per_page: 100,
            })).map(label => label.name);
            const labels = await getLabels();
            const selected = teamLabelNames.filter(name => labels.includes(name));
            const manual = labels.includes('Ownership: Manual');

            if (manual) {
              core.setOutput('dispatch', 'false');
              if (selected.length === 1) {
                if (labels.includes('Ownership: Needs Review')) {
                  try {
                    await github.rest.issues.removeLabel({
                      ...context.repo, issue_number, name: 'Ownership: Needs Review',
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                await core.summary.addHeading('Manual ownership override')
                  .addRaw(`Preserving **${selected[0]}**; automated classification was skipped.`)
                  .write();
                return;
              }
              if (!labels.includes('Ownership: Needs Review')) {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number, labels: ['Ownership: Needs Review'],
                });
              }
              await core.summary.addHeading('Invalid manual ownership override')
                .addRaw(`Expected exactly one team label; found **${selected.length}**. Team labels were preserved.`)
                .write();
              throw new Error('Ownership: Manual requires exactly one team label');
            }

            if (auditOnly) {
              core.setOutput('dispatch', 'false');
              core.info('No manual override is present; this label event requires no action.');
              return;
            }
            core.setOutput('dispatch', 'true');

      - name: Create correlation token
        if: steps.preflight.outputs.dispatch == 'true'
        id: correlation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: core.setOutput('token', require('crypto').randomUUID())

      - name: Mint token for BCAppsTriage
        if: steps.preflight.outputs.dispatch == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.AGENT_REPO_NAME }}

      - name: Dispatch ownership producer
        if: steps.preflight.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SUBJECT_KIND: ${{ env.SUBJECT_KIND }}
          SUBJECT_NUMBER: ${{ env.SUBJECT_NUMBER }}
          CORRELATION_TOKEN: ${{ steps.correlation.outputs.token }}
        run: |
          set -euo pipefail
          gh workflow run "$AGENT_WORKFLOW" --repo "$AGENT_REPO" --ref "$AGENT_REF" \
            -f repository="$GITHUB_REPOSITORY" \
            -f subject_kind="$SUBJECT_KIND" \
            -f subject_number="$SUBJECT_NUMBER" \
            -f correlation_token="$CORRELATION_TOKEN"

      - name: Await successful producer run
        if: steps.preflight.outputs.dispatch == 'true'
        id: await
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          CORRELATION_TOKEN: ${{ steps.correlation.outputs.token }}
        run: |
          set -euo pipefail
          marker="[$CORRELATION_TOKEN]"
          run_id=""
          for _ in $(seq 1 30); do
            run_id=$(gh run list --repo "$AGENT_REPO" --workflow "$AGENT_WORKFLOW" \
              --event workflow_dispatch --limit 100 --json databaseId,displayTitle \
              --jq ".[] | select(.displayTitle | contains(\"$marker\")) | .databaseId" |
              head -n 1) || true
            if [ -n "$run_id" ]; then break; fi
            sleep 10
          done
          if [ -z "$run_id" ]; then
            echo "::error::Timed out waiting for the correlated ownership producer run."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$AGENT_REPO" --interval 15 --exit-status
          conclusion=$(gh run view "$run_id" --repo "$AGENT_REPO" --json conclusion --jq .conclusion)
          test "$conclusion" = "success"

      - name: Download ownership result
        if: steps.preflight.outputs.dispatch == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.await.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir result
          gh run download "$RUN_ID" --repo "$AGENT_REPO" \
            --name ownership-result --dir result
          test -f result/ownership-result.json

      - name: Validate and apply ownership result
        if: steps.preflight.outputs.dispatch == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          RESULT_PATH: result/ownership-result.json
          CORRELATION_TOKEN: ${{ steps.correlation.outputs.token }}
          SUBJECT_KIND: ${{ env.SUBJECT_KIND }}
          SUBJECT_NUMBER: ${{ env.SUBJECT_NUMBER }}
        with:
          script: |
            const fs = require('fs');
            const { TextDecoder } = require('util');
            // See the preflight step: the team taxonomy is discovered from the
            // repository's "Team: " labels rather than hardcoded here.
            const TEAM_LABEL_PREFIX = 'Team: ';
            const MIN_TEAM_LABELS = 2;
            const UNRESOLVED_TEAM = 'Other';
            const ownershipLabels = ['Ownership: Manual', 'Ownership: Needs Review'];

            const normaliseTeam = value => String(value ?? '')
              .replace(/^team:\s*/i, '')
              .toLowerCase()
              .replace(/[^a-z0-9]/g, '')
              .replace(/s$/, '');

            const deriveTeams = repoLabels => {
              const labelNames = repoLabels
                .map(label => label.name)
                .filter(name => name.startsWith(TEAM_LABEL_PREFIX));
              if (labelNames.length < MIN_TEAM_LABELS) {
                throw new Error(
                  `Found ${labelNames.length} "${TEAM_LABEL_PREFIX}" label(s), expected at least ` +
                  `${MIN_TEAM_LABELS}. Team ownership labels are missing from this repository.`,
                );
              }
              const labelByTeam = new Map();
              const teamByNormalised = new Map();
              for (const label of labelNames) {
                const team = label.slice(TEAM_LABEL_PREFIX.length).trim();
                const key = normaliseTeam(team);
                if (!key) {
                  throw new Error(`Label "${label}" has no usable team name after the prefix.`);
                }
                if (teamByNormalised.has(key)) {
                  throw new Error(
                    `Team labels "${teamByNormalised.get(key)}" and "${team}" are indistinguishable ` +
                    'once normalised, so the agent\'s answer would be ambiguous. Rename one.',
                  );
                }
                labelByTeam.set(team, label);
                teamByNormalised.set(key, team);
              }
              if (!teamByNormalised.has(normaliseTeam(UNRESOLVED_TEAM))) {
                throw new Error(
                  `No "${TEAM_LABEL_PREFIX}${UNRESOLVED_TEAM}" label exists; found ` +
                  `${[...labelByTeam.keys()].map(name => `"${name}"`).join(', ')}. This repository ` +
                  'needs that label for work the agent cannot attribute to a team.',
                );
              }
              return {
                teamLabelNames: [...labelByTeam.values()],
                labelFor: team => labelByTeam.get(team),
                canonicalTeam: value => teamByNormalised.get(normaliseTeam(value)) ?? null,
              };
            };

            const confidenceValues = ['high', 'medium', 'low'];
            const sources = [
              'issue:path', 'issue:localization', 'issue:title-object',
              'issue:title-phrase', 'issue:app-area', 'issue:body-object',
              'issue:unresolved', 'pull_request:changed-files',
              'pull_request:ambiguous', 'pull_request:unresolved',
              'pull_request:incomplete-files',
              'pull_request:linked-issue',
            ];
            const issue_number = Number(process.env.SUBJECT_NUMBER);
            const bytes = fs.readFileSync(process.env.RESULT_PATH);
            if (bytes.length > 67108864) {
              throw new Error('ownership-result.json exceeds 67,108,864 UTF-8 bytes');
            }
            let result;
            try {
              result = JSON.parse(new TextDecoder('utf-8', { fatal: true }).decode(bytes));
            } catch (error) {
              throw new Error(`ownership-result.json is not valid UTF-8 JSON: ${error.message}`);
            }
            const object = value => value && typeof value === 'object' && !Array.isArray(value);
            if (!object(result) || !object(result.subject) || !object(result.ownership)) {
              throw new Error('ownership-result.json must contain the v1 result object');
            }
            const reason = result.ownership.reason;
            // Discovery has to happen before the result is validated, because
            // the set of valid teams IS the set of team labels in the
            // repository. The label list was already being fetched a few lines
            // below; it is simply read earlier now.
            const repoLabels = await github.paginate(
              github.rest.issues.listLabelsForRepo, { ...context.repo, per_page: 100 },
            );
            const available = new Set(repoLabels.map(label => label.name));
            const { teamLabelNames, labelFor, canonicalTeam } = deriveTeams(repoLabels);
            const missing = ownershipLabels.filter(name => !available.has(name));
            if (missing.length) {
              throw new Error(`Required ownership labels disappeared: ${missing.join(', ')}`);
            }
            if (
              result.schemaVersion !== 1 ||
              result.correlationToken !== process.env.CORRELATION_TOKEN ||
              result.subject.repository !== context.payload.repository.full_name ||
              result.subject.kind !== process.env.SUBJECT_KIND ||
              result.subject.number !== issue_number ||
              !Number.isSafeInteger(result.subject.number) ||
              // Checked as a string before it is normalised. normaliseTeam
              // coerces, so without this ["Finance"] from the artifact would
              // stringify to a valid team name -- something the hardcoded
              // teams.includes() rejected for free.
              typeof result.ownership.team !== 'string' ||
              canonicalTeam(result.ownership.team) === null ||
              !confidenceValues.includes(result.ownership.confidence) ||
              !sources.includes(result.ownership.source) ||
              typeof reason !== 'string' ||
              reason.length === 0 ||
              reason.length > 1000 ||
              reason.trim().length === 0 ||
              /[\u0000-\u001F\u007F]/.test(reason)
            ) {
              throw new Error('The ownership result from BCAppsTriage was malformed, so no labels were changed.');
            }

            const getLabels = async () => (await github.paginate(github.rest.issues.listLabelsOnIssue, {
              ...context.repo, issue_number, per_page: 100,
            })).map(label => label.name);

            let labels = await getLabels();
            if (labels.includes('Ownership: Manual')) {
              const selected = teamLabelNames.filter(name => labels.includes(name));
              if (selected.length === 1) {
                if (labels.includes('Ownership: Needs Review')) {
                  try {
                    await github.rest.issues.removeLabel({
                      ...context.repo, issue_number, name: 'Ownership: Needs Review',
                    });
                  } catch (error) {
                    if (error.status !== 404) throw error;
                  }
                }
                await core.summary.addHeading('Manual ownership override')
                  .addRaw(`Preserving **${selected[0]}**; automated classification was skipped.`)
                  .write();
                return;
              }
              if (!labels.includes('Ownership: Needs Review')) {
                await github.rest.issues.addLabels({
                  ...context.repo, issue_number, labels: ['Ownership: Needs Review'],
                });
              }
              throw new Error(
                `Ownership: Manual requires exactly one team label; found ${selected.length}.`,
              );
            }

            const team = canonicalTeam(result.ownership.team);
            const teamLabel = labelFor(team);
            // Compared loosely for the same reason the team name is: the
            // unresolved bucket is a semantic rule, and should survive its
            // label being spelled slightly differently.
            const needsReview = normaliseTeam(team) === normaliseTeam(UNRESOLVED_TEAM)
              || result.ownership.confidence === 'low';
            const safeReason = reason.replace(/[\r\n|]+/g, ' ').trim();
            await core.summary.addHeading('Ownership decision').addTable([
              [{ data: 'Field', header: true }, { data: 'Value', header: true }],
              ['Subject', `${process.env.SUBJECT_KIND} #${issue_number}`],
              ['Team', team],
              ['Source', result.ownership.source],
              ['Confidence', result.ownership.confidence],
              ['Reason', safeReason],
            ]).write();

            const additions = [];
            if (!labels.includes(teamLabel)) additions.push(teamLabel);
            if (needsReview && !labels.includes('Ownership: Needs Review')) {
              additions.push('Ownership: Needs Review');
            }
            if (additions.length) {
              await github.rest.issues.addLabels({ ...context.repo, issue_number, labels: additions });
            }

            for (const other of teamLabelNames.filter(name => name !== teamLabel && labels.includes(name))) {
              try {
                await github.rest.issues.removeLabel({ ...context.repo, issue_number, name: other });
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }
            if (!needsReview && labels.includes('Ownership: Needs Review')) {
              try {
                await github.rest.issues.removeLabel(
                  { ...context.repo, issue_number, name: 'Ownership: Needs Review' },
                );
              } catch (error) {
                if (error.status !== 404) throw error;
              }
            }

            const verified = await getLabels();
            const selected = teamLabelNames.filter(name => verified.includes(name));
            if (
              selected.length !== 1 ||
              selected[0] !== teamLabel ||
              verified.includes('Ownership: Needs Review') !== needsReview
            ) {
              throw new Error('Ownership labels could not be applied consistently. Rerun this workflow.');
            }
            core.info(`Applied and verified ${teamLabel}.`);

      - name: Report visible failure
        if: failure()
        run: |
          echo "### Ownership classification failed" >> "$GITHUB_STEP_SUMMARY"
          echo "Ownership classification failed, so no labels were changed. Existing labels were left untouched." >> "$GITHUB_STEP_SUMMARY"
