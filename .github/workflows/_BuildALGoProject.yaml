name: '_Build AL-Go project'

run-name: 'Build ${{ inputs.project }}'

on:
  workflow_call:
    inputs:
      shell:
        description: Shell in which you want to run the action (powershell or pwsh)
        required: false
        default: powershell
        type: string
      runsOn:
        description: JSON-formatted string of the types of machine to run the build job on
        required: true
        type: string
      checkoutRef:
        description: Ref to checkout
        required: false
        default: ${{ github.sha }}
        type: string
      project:
        description: Name of the built project
        required: true
        type: string
      projectName:
        description: Friendly name of the built project
        required: true
        type: string
      skippedProjectsJson:
        description: An array of AL-Go projects to skip in compressed JSON format
        required: false
        default: '[]'
        type: string
      projectDependenciesJson:
        description: Dependencies of the built project in compressed Json format
        required: false
        default: '{}'
        type: string
      buildMode:
        description: Build mode used when building the artifacts
        required: true
        type: string
      baselineWorkflowRunId:
        description: ID of the baseline workflow run, from where to download the current project dependencies, in case they are not built in the current workflow run
        required: false
        default: '0'
        type: string
      baselineWorkflowSHA:
        description: SHA of the baseline workflow run
        required: false
        default: ''
        type: string
      secrets:
        description: A comma-separated string with the names of the secrets, required for the workflow.
        required: false
        default: ''
        type: string
      artifactsRetentionDays:
        description: Number of days to keep the artifacts
        type: number
        default: 0
      artifactsNameSuffix:
        description: Suffix to add to the artifacts names
        required: false
        default: ''
        type: string
      signArtifacts:
        description: Flag indicating whether the apps should be signed
        type: boolean
        default: false
      useArtifactCache:
        description: Flag determining whether to use the Artifacts Cache
        type: boolean
        default: false
      needsContext:
        description: JSON formatted needs context
        type: string
        default: '{}'

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

env:
  ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
  ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}

jobs:
  BuildALGoProject:
    needs: [ ]
    runs-on: ${{ fromJson(inputs.runsOn) }}
    defaults:
      run:
        shell: ${{ inputs.shell }}
    name: ${{ inputs.projectName }} (${{ inputs.buildMode }})
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkoutRef }}
          lfs: true

      - name: Read settings
        uses: spetersenms/AL-Go/Actions/ReadSettings@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
          buildMode: ${{ inputs.buildMode }}
          get: useCompilerFolder,workspaceCompilation,keyVaultCodesignCertificateName,doNotSignApps,doNotRunTests,doNotRunBcptTests,doNotRunpageScriptingTests,artifact,generateDependencyArtifact,trustedSigning,useGitSubmodules,trackALAlertsInGitHub,skipUpgrade

      - name: Run Build Initialize hook
        if: hashFiles(format('{0}/.AL-Go/BuildInitialize.ps1', inputs.project)) != ''
        uses: spetersenms/AL-Go/Actions/RunHook@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
          hookName: BuildInitialize

      - name: Determine whether to build project
        id: DetermineBuildProject
        uses: spetersenms/AL-Go/Actions/DetermineBuildProject@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          skippedProjectsJson: ${{ inputs.skippedProjectsJson }}
          project: ${{ inputs.project }}
          baselineWorkflowRunId: ${{ inputs.baselineWorkflowRunId }}
          buildMode: ${{ inputs.buildMode }}

      - name: Read secrets
        id: ReadSecrets
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True'
        uses: spetersenms/AL-Go/Actions/ReadSecrets@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: '${{ inputs.secrets }},appDependencySecrets,AZURE_CREDENTIALS,-gitSubmodulesToken'

      - name: Checkout Submodules
        if: env.useGitSubmodules != 'false' && env.useGitSubmodules != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.checkoutRef }}
          lfs: true
          submodules: ${{ env.useGitSubmodules }}
          token: '${{ fromJson(steps.ReadSecrets.outputs.Secrets).gitSubmodulesToken }}'

      - name: Determine ArtifactUrl
        id: determineArtifactUrl
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True'
        uses: spetersenms/AL-Go/Actions/DetermineArtifactUrl@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}

      - name: Cache Business Central Artifacts
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True' && env.useCompilerFolder == 'True' && inputs.useArtifactCache && env.artifactCacheKey
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/.artifactcache
          key: ${{ env.artifactCacheKey }}

      - name: Download Project Dependencies
        id: DownloadProjectDependencies
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True'
        uses: spetersenms/AL-Go/Actions/DownloadProjectDependencies@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
          buildMode: ${{ inputs.buildMode }}
          projectDependenciesJson: ${{ inputs.projectDependenciesJson }}
          baselineWorkflowRunId: ${{ inputs.baselineWorkflowRunId }}

      - name: Download Previous Release
        id: DownloadPreviousRelease
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True' && env.skipUpgrade == 'False'
        uses: spetersenms/AL-Go/Actions/DownloadPreviousRelease@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}

      - name: Compile Apps
        id: compile
        uses: spetersenms/AL-Go/Actions/CompileApps@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True' && fromJson(env.workspaceCompilation).enabled == true
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
          BuildMode: ${{ inputs.buildMode }}
        with:
          shell: ${{ inputs.shell }}
          artifact: ${{ env.artifact }}
          project: ${{ inputs.project }}
          buildMode: ${{ inputs.buildMode }}
          dependencyAppsJson: ${{ steps.DownloadProjectDependencies.outputs.DownloadedApps }}
          dependencyTestAppsJson: ${{ steps.DownloadProjectDependencies.outputs.DownloadedTestApps }}
          baselineWorkflowRunId: ${{ inputs.baselineWorkflowRunId }}
          baselineWorkflowSHA: ${{ inputs.baselineWorkflowSHA }}
          previousAppsPath: ${{ steps.DownloadPreviousRelease.outputs.PreviousAppsPath }}

      - name: Save needs context to file
        shell: pwsh
        run: |
          $nc = @'
          ${{ inputs.needsContext }}
          '@
          $needsContextPath = Join-Path $ENV:RUNNER_TEMP 'needsContext.json'
          [System.IO.File]::WriteAllText($needsContextPath, $nc.Trim())
          Add-Content -Encoding UTF8 -Path $env:GITHUB_ENV -Value "NeedsContext=$needsContextPath"

      - name: Build
        uses: spetersenms/AL-Go/Actions/RunPipeline@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True'
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
          BuildMode: ${{ inputs.buildMode }}
          NeedsContext: ${{ env.NeedsContext }}
          # Pinned dependency analysis requires Windows project IDs; accept both separator forms.
          BCAPPS_ALTOOL_VERIFICATION: ${{ (inputs.project == 'build/projects/Test Apps W1' || inputs.project == 'build\projects\Test Apps W1') && 'true' || 'false' }}
        with:
          shell: ${{ inputs.shell }}
          artifact: ${{ env.artifact }}
          project: ${{ inputs.project }}
          buildMode: ${{ inputs.buildMode }}
          installAppsJson: ${{ steps.DownloadProjectDependencies.outputs.DownloadedApps }}
          installTestAppsJson: ${{ steps.DownloadProjectDependencies.outputs.DownloadedTestApps }}
          baselineWorkflowRunId: ${{ inputs.baselineWorkflowRunId }}
          baselineWorkflowSHA: ${{ inputs.baselineWorkflowSHA }}
          previousAppsPath: ${{ steps.DownloadPreviousRelease.outputs.PreviousAppsPath }}

      - name: Install .NET 10 for custom ALTool
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True' && (inputs.project == 'build/projects/Test Apps W1' || inputs.project == 'build\projects\Test Apps W1')
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: '10.0.x'

      - name: Prepare verification ALTool
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True' && (inputs.project == 'build/projects/Test Apps W1' || inputs.project == 'build\projects\Test Apps W1')
        shell: pwsh
        run: |
          if ($env:runTestsInSeparateAction -ne 'True') {
            throw 'W1 verification requires separate native test execution; BCH fallback is forbidden.'
          }
          & "$env:GITHUB_WORKSPACE\build\scripts\Prepare-VerificationAlTool.ps1"

      - name: Run Tests
        uses: spetersenms/AL-Go/Actions/RunTests@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True' && env.runTestsInSeparateAction == 'True'
        env:
          Secrets: '${{ steps.ReadSecrets.outputs.Secrets }}'
          BCAPPS_ALTOOL_VERIFICATION: 'true'
          BCAPPS_FRAMEWORK_APPS_JSON: '${{ steps.DownloadProjectDependencies.outputs.DownloadedApps }}'
        with:
          shell: pwsh
          project: ${{ inputs.project }}
          projectName: ${{ inputs.projectName }}
          buildMode: ${{ inputs.buildMode }}
          installTestAppsJson: ${{ steps.DownloadProjectDependencies.outputs.DownloadedTestApps }}

      - name: Sign
        id: sign
        if: steps.DetermineBuildProject.outputs.BuildIt == 'True' && inputs.signArtifacts && env.doNotSignApps == 'False' && (env.keyVaultCodesignCertificateName != '' || (fromJson(env.trustedSigning).Endpoint != '' && fromJson(env.trustedSigning).Account != '' && fromJson(env.trustedSigning).CertificateProfile != '')) && (hashFiles(format('{0}/.buildartifacts/Apps/*.app',inputs.project)) != '')
        uses: spetersenms/AL-Go/Actions/Sign@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          azureCredentialsJson: '${{ fromJson(steps.ReadSecrets.outputs.Secrets).AZURE_CREDENTIALS }}'
          pathToFiles: '${{ inputs.project }}/.buildartifacts/Apps/*.app'

      - name: Calculate Artifact names
        id: calculateArtifactsNames
        uses: spetersenms/AL-Go/Actions/CalculateArtifactNames@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        if: success() || failure()
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
          buildMode: ${{ inputs.buildMode }}
          suffix: ${{ inputs.artifactsNameSuffix }}

      - name: Publish artifacts - apps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: inputs.artifactsRetentionDays >= 0 && (hashFiles(format('{0}/.buildartifacts/Apps/*',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.AppsArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/Apps/'
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifactsRetentionDays }}

      - name: Publish artifacts - dependencies
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: inputs.artifactsRetentionDays >= 0 && env.generateDependencyArtifact == 'True' && (hashFiles(format('{0}/.buildartifacts/Dependencies/*',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.DependenciesArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/Dependencies/'
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifactsRetentionDays }}

      - name: Publish artifacts - test apps
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: inputs.artifactsRetentionDays >= 0 && (hashFiles(format('{0}/.buildartifacts/TestApps/*',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.TestAppsArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/TestApps/'
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifactsRetentionDays }}

      - name: Publish artifacts - build output
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: (success() || failure()) && (hashFiles(format('{0}/BuildOutput.txt',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.BuildOutputArtifactsName }}
          path: '${{ inputs.project }}/BuildOutput.txt'
          if-no-files-found: ignore

      - name: Publish artifacts - container event log
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: (failure()) && (hashFiles(format('{0}/ContainerEventLog.evtx',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.ContainerEventLogArtifactsName }}
          path: '${{ inputs.project }}/ContainerEventLog.evtx'
          if-no-files-found: ignore

      - name: Publish artifacts - test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: (success() || failure()) && (hashFiles(format('{0}/.buildartifacts/TestResults.xml',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.TestResultsArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/TestResults.xml'
          if-no-files-found: ignore

      - name: Publish artifacts - bcpt test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: (success() || failure()) && (hashFiles(format('{0}/.buildartifacts/bcptTestResults.json',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.BcptTestResultsArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/bcptTestResults.json'
          if-no-files-found: ignore

      - name: Publish artifacts - page scripting test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: (success() || failure()) && (hashFiles(format('{0}/.buildartifacts/PageScriptingTestResults.xml',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.PageScriptingTestResultsArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/PageScriptingTestResults.xml'
          if-no-files-found: ignore

      - name: Publish artifacts - page scripting test result details
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: (success() || failure()) && (hashFiles(format('{0}/.buildartifacts/PageScriptingTestResultDetails/*',inputs.project)) != '')
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.PageScriptingTestResultDetailsArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/PageScriptingTestResultDetails/'
          if-no-files-found: ignore

      - name: Publish artifacts - ErrorLogs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        env:
          ACTIONS_RUNNER_DISABLE_NODE_MAGLEV: 1
        if: (success() || failure()) && inputs.artifactsRetentionDays >= 0 && (hashFiles(format('{0}/.buildartifacts/ErrorLogs/*',inputs.project)) != '') && env.trackALAlertsInGitHub == 'True'
        with:
          name: ${{ steps.calculateArtifactsNames.outputs.ErrorLogsArtifactsName }}
          path: '${{ inputs.project }}/.buildartifacts/ErrorLogs/'
          if-no-files-found: ignore
          retention-days: ${{ inputs.artifactsRetentionDays }}

      - name: Report native test infrastructure errors
        id: nativeTestSummary
        if: (success() || failure()) && env.doNotRunTests == 'False'
        shell: pwsh
        env:
          BCAPPS_TEST_PROJECT: '${{ inputs.project }}'
        run: |
          Import-Module "$env:GITHUB_WORKSPACE\build\scripts\AlToolTestAdapter.psm1"
          $resultPath = Join-Path (Join-Path $env:GITHUB_WORKSPACE $env:BCAPPS_TEST_PROJECT) '.buildartifacts\TestResults.xml'
          $hasErrors = Write-BcAppsNativeTestSummary -ResultPath $resultPath -SummaryPath $env:GITHUB_STEP_SUMMARY
          "hasInfrastructureErrors=$($hasErrors.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($hasErrors) {
            throw 'Native test infrastructure errors are present. See TestResults.xml and the incomplete-run summary.'
          }

      - name: Analyze Test Results
        id: analyzeTestResults
        if: (success() || failure()) && env.doNotRunTests == 'False' && steps.nativeTestSummary.outputs.hasInfrastructureErrors != 'true'
        uses: spetersenms/AL-Go/Actions/AnalyzeTests@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
          testType: "normal"

      - name: Analyze BCPT Test Results
        id: analyzeTestResultsBCPT
        if: (success() || failure()) && env.doNotRunBcptTests == 'False'
        uses: spetersenms/AL-Go/Actions/AnalyzeTests@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
          testType: "bcpt"

      - name: Analyze Page Scripting Test Results
        id: analyzeTestResultsPageScripting
        if: (success() || failure()) && env.doNotRunpageScriptingTests == 'False'
        uses: spetersenms/AL-Go/Actions/AnalyzeTests@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
          testType: "pageScripting"

      - name: Cleanup
        if: always() && steps.DetermineBuildProject.outputs.BuildIt == 'True'
        uses: spetersenms/AL-Go/Actions/PipelineCleanup@5fdf6dd31beb4edab0b6fdecb7c8866e9e81a318
        with:
          shell: ${{ inputs.shell }}
          project: ${{ inputs.project }}
