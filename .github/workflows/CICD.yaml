    if: always() && !cancelled() && needs.Plan.result == 'success' && needs.Plan.outputs.mode == 'originals'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch05 }}
      replacement: ${{ needs.Plan.outputs.replacement }}
      w1Package: ${{ needs.Plan.outputs.w1Package }}
      dePackage: ${{ needs.Plan.outputs.dePackage }}
