name: 'SQL API tenant count exploratory comparison - DO NOT MERGE'
run-name: SQL API tenant count comparison - 20 originals

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

# Repository-wide literal group shared with the original 300 and its replacements.
# One pending run only: do not submit another contender while this run is pending.
concurrency:
  group: sql-api-646383-300-trial-comparison
  cancel-in-progress: false

jobs:
  Plan:
    if: github.repository == 'microsoft/BCApps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/features/646383-sql-api-tenant-count-comparison' && github.run_attempt == 1
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify preserved package snapshots and 20 original identities
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\build\scripts\SqlResetPilot\PlanTenantCount.ps1
      - name: Preserve immutable exploratory manifest
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sql-api-tenant-manifest-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          path: .sql-api-tenant-plan/*.json

  Trials:
    needs: Plan
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.matrix }}
      replacement: 'null'
      w1Package: '11487493885'
      dePackage: '11486874993'
      packageRun: '37634358042'
