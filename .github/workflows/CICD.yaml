name: 'SQL API worker remount warmup - DO NOT MERGE'
run-name: SQL API worker remount warmup - 20 original trials

on:
  workflow_dispatch:
    inputs:
      schedulingApproval:
        description: Parent must first verify that no pending comparison would be replaced
        required: true
        type: choice
        options: [parent-verified-safe-scheduling]

permissions:
  actions: read
  checks: read
  contents: read
  id-token: write
  packages: read

concurrency:
  group: sql-api-646383-300-trial-comparison
  cancel-in-progress: false

jobs:
  Plan:
    if: github.repository == 'microsoft/BCApps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/features/646383-sql-api-worker-warmup-comparison' && github.run_attempt == 1 && inputs.schedulingApproval == 'parent-verified-safe-scheduling'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify preserved immutable packages and paired schedule
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: .\build\scripts\SqlResetPilot\PlanWorkerWarmup.ps1
      - name: Preserve original scheduling and package proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sql-api-worker-warmup-manifest-${{ github.run_id }}
          path: .sql-api-worker-plan/*.json
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error

  Trials:
    needs: Plan
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    with:
      matrix: ${{ needs.Plan.outputs.matrix }}
      replacement: 'null'
      w1Package: '11487493885'
      dePackage: '11486874993'
      packageRun: '37634358042'
    secrets: inherit
