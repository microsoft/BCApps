  Batch06:
    needs: [Plan, Batch05]
    if: always() && !cancelled() && needs.Plan.result == 'success' && needs.Plan.outputs.mode == 'originals'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch06 }}
      replacement: ${{ needs.Plan.outputs.replacement }}
      w1Package: ${{ needs.Plan.outputs.w1Package }}
      dePackage: ${{ needs.Plan.outputs.dePackage }}
      packageRun: ${{ needs.Plan.outputs.packageRun }}

  Batch07:
    needs: [Plan, Batch06]
    if: always() && !cancelled() && needs.Plan.result == 'success' && needs.Plan.outputs.mode == 'originals'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch07 }}
      replacement: ${{ needs.Plan.outputs.replacement }}
      w1Package: ${{ needs.Plan.outputs.w1Package }}
      dePackage: ${{ needs.Plan.outputs.dePackage }}
      packageRun: ${{ needs.Plan.outputs.packageRun }}

  Batch08:
    needs: [Plan, Batch07]
    if: always() && !cancelled() && needs.Plan.result == 'success' && needs.Plan.outputs.mode == 'originals'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch08 }}
      replacement: ${{ needs.Plan.outputs.replacement }}
      w1Package: ${{ needs.Plan.outputs.w1Package }}
      dePackage: ${{ needs.Plan.outputs.dePackage }}
