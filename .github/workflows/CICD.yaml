name: 'SQL reset paired pilot - DO NOT MERGE'

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

jobs:
  Pilot:
    if: github.ref == 'refs/heads/features/646383-sql-reset-pilot' && github.run_attempt == 1
    strategy:
      fail-fast: false
      matrix:
        arm: [control, fresh]
    runs-on: GitHub-BCAppsPL
    timeout-minutes: 120
    defaults:
      run:
        shell: powershell
    env:
      ALGoOrgSettings: ${{ vars.ALGoOrgSettings }}
      ALGoRepoSettings: ${{ vars.ALGoRepoSettings }}
      BC_SQL_PILOT_ARM: ${{ matrix.arm }}
      BuildMode: IntegrationTests
    steps:
      - name: Checkout experiment
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          lfs: true
          fetch-depth: 2

      - name: Validate provenance and download exact compiled PR2 packages
        id: packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & .\build\scripts\SqlResetPilot\Prepare.ps1

      - name: Read pinned W1 Integration settings
        uses: microsoft/AL-Go/Actions/ReadSettings@91b96c2b294be6f823277dafe6f03350abfb9d23
        with:
          shell: powershell
          project: build/projects/Test Apps W1
          buildMode: IntegrationTests

      - name: Read normal disposable CI license and package secrets
        id: secrets
        uses: microsoft/AL-Go/Actions/ReadSecrets@91b96c2b294be6f823277dafe6f03350abfb9d23
        with:
          shell: powershell
          gitHubSecrets: ${{ toJson(secrets) }}
          getSecrets: 'licenseFileUrl,gitHubPackagesContext,applicationInsightsConnectionString,appDependencySecrets'

      - name: Execute original pipeline with bounded clean-test prefix
        uses: microsoft/AL-Go/Actions/RunPipeline@91b96c2b294be6f823277dafe6f03350abfb9d23
        env:
          Secrets: '${{ steps.secrets.outputs.Secrets }}'
        with:
          shell: powershell
          project: build/projects/Test Apps W1
          buildMode: IntegrationTests
          artifact: https://bcinsider-fvh2ekdjecfjd6gk.b02.azurefd.net/sandbox/30.0.55683.0/w1
          installAppsJson: ${{ steps.packages.outputs.apps }}
          installTestAppsJson: ${{ steps.packages.outputs.tests }}

      - name: Export diagnostics and tear down only owned disposable container
        if: always()
        run: |
          & .\build\scripts\SqlResetPilot\Finalize.ps1

      - name: Preserve raw outcomes (including failures)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: sql-reset-pilot-${{ matrix.arm }}-${{ github.run_id }}
          retention-days: 7
          if-no-files-found: error
          path: |
            sql-reset-pilot-output/**
            build/projects/Test Apps W1/TestResults*.xml
            build/projects/Test Apps W1/ContainerEventLog.evtx
            build/projects/Test Apps W1/BuildOutput.txt
