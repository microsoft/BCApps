name: 'SQL platform fix uptake - DO NOT MERGE'
run-name: SQL platform 30.0.56092.0 - ten original control cells

on:
  workflow_dispatch:
    inputs:
      authorization:
        description: Exact authorization AB653457-fixed-platform-original-control-10
        type: string
        required: true

permissions:
  actions: read
  contents: read
  id-token: write
  packages: read

concurrency:
  group: sql-platform-653457-fixed-uptake
  cancel-in-progress: false

jobs:
  Plan:
    if: github.repository == 'microsoft/BCApps' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/features/653457-sql-platform-fix-uptake' && github.run_attempt == 1 && inputs.authorization == 'AB653457-fixed-platform-original-control-10'
    runs-on: windows-latest
    timeout-minutes: 10
    outputs:
      batch01: ${{ steps.plan.outputs.batch01 }}
      batch02: ${{ steps.plan.outputs.batch02 }}
      batch03: ${{ steps.plan.outputs.batch03 }}
      batch04: ${{ steps.plan.outputs.batch04 }}
      batch05: ${{ steps.plan.outputs.batch05 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - name: Verify original package transport and canonical fixed-runtime plan
        id: plan
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BC_SQL_UPTAKE_AUTHORIZATION: ${{ inputs.authorization }}
        run: .\build\scripts\SqlResetPilot\PlanPlatformUptake.ps1
      - name: Preserve scheduling and package provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sql-platform-uptake-manifest-${{ github.run_id }}
          retention-days: 14
          if-no-files-found: error
          include-hidden-files: true
          path: .sql-api-comparison-plan/*.json

  Batch01:
    needs: Plan
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch01 }}
      authorization: ${{ inputs.authorization }}

  Batch02:
    needs: [Plan, Batch01]
    if: always() && !cancelled() && needs.Plan.result == 'success'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch02 }}
      authorization: ${{ inputs.authorization }}

  Batch03:
    needs: [Plan, Batch02]
    if: always() && !cancelled() && needs.Plan.result == 'success'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch03 }}
      authorization: ${{ inputs.authorization }}

  Batch04:
    needs: [Plan, Batch03]
    if: always() && !cancelled() && needs.Plan.result == 'success'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch04 }}
      authorization: ${{ inputs.authorization }}

  Batch05:
    needs: [Plan, Batch04]
    if: always() && !cancelled() && needs.Plan.result == 'success'
    uses: ./.github/workflows/SqlApiComparisonBatch.yaml
    secrets: inherit
    with:
      matrix: ${{ needs.Plan.outputs.batch05 }}
      authorization: ${{ inputs.authorization }}
