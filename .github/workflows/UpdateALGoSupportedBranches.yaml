name: Update AL-Go Supported Branches

on:
  workflow_dispatch:
  schedule:
    - cron: '30 5 5 * *' # Monthly on the 5th at 05:30 UTC

defaults:
  run:
    shell: powershell

permissions: read-all

jobs:
  UpdateALGoSupportedBranches:
    name: Update AL-Go Supported Branches
    if: github.repository_owner == 'microsoft'
    permissions:
      contents: write
    environment: Official-Build
    runs-on: windows-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Update AL-Go Supported Branches
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: microsoft/BCApps/.github/actions/RunAutomation@main
        with:
          automations: UpdateSystemFilesSchedule
          targetBranch: main
