name: BC ExtRequest Triage (Manual)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: BCApps issue number to process
        required: true
        type: number

permissions:
  issues: write
  contents: read
  id-token: write
  copilot-requests: write

concurrency:
  group: bc-extrequest-triage-${{ inputs.issue_number }}
  cancel-in-progress: false

jobs:
  process:
    if: github.repository == 'microsoft/BCApps'
    runs-on: ubuntu-latest
    environment: triage
    steps:
      - name: Mint token for BCAppsTriage
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: BCAppsTriage

      - name: Checkout BCAppsTriage source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/BCAppsTriage
          token: ${{ steps.app-token.outputs.token }}
          path: _triage-src

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: _triage-src/internal/BC_ExtRequest_Triage/package-lock.json

      - name: Install dependencies
        working-directory: _triage-src/internal/BC_ExtRequest_Triage
        run: npm ci

      - name: Make process-issue script executable
        run: chmod +x _triage-src/internal/BC_ExtRequest_Triage/scripts/process-issue.sh

      - name: Azure login (OIDC)
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "Process issue #${{ inputs.issue_number }}"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO_READ_TOKEN: ${{ github.token }}
        run: |
          bash _triage-src/internal/BC_ExtRequest_Triage/scripts/process-issue.sh \
            "${{ inputs.issue_number }}" \
            "${{ github.repository }}" \
            "$(pwd)/_triage-src"

      - name: Upload result artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bc-extrequest-triage-result-${{ github.run_id }}-issue-${{ inputs.issue_number }}
          path: _triage-src/internal/BC_ExtRequest_Triage/data/triage_result.json
          retention-days: 30
          if-no-files-found: ignore
