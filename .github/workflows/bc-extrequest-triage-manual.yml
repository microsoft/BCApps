name: BC ExtRequest Triage (Manual)

on:
  workflow_dispatch:
    inputs:
      issue_number:
        description: BCApps issue number to process
        required: true
        type: number

permissions:
  issues: write
  contents: read

concurrency:
  group: bc-extrequest-triage-${{ inputs.issue_number }}
  cancel-in-progress: false

env:
  AGENT_REPO: microsoft/BCAppsTriage
  AGENT_REPO_NAME: BCAppsTriage
  AGENT_WORKFLOW: bc-extrequest-triage-agent.yml
  AGENT_REF: main

jobs:
  process:
    if: github.repository == 'microsoft/BCApps'
    runs-on: ubuntu-latest
    environment: triage
    steps:
      - name: Create correlation token
        id: correlation
        run: echo "run_token=$(uuidgen)" >> "$GITHUB_OUTPUT"

      - name: Mint token for BCAppsTriage
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.AGENT_REPO_NAME }}

      - name: Start ExtRequest triage
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          RUN_TOKEN: ${{ steps.correlation.outputs.run_token }}
        run: |
          set -euo pipefail
          gh workflow run "$AGENT_WORKFLOW" -R "$AGENT_REPO" --ref "$AGENT_REF" \
            -f issue_number="$ISSUE_NUMBER" \
            -f run_token="$RUN_TOKEN"

      - name: Await ExtRequest triage
        id: await
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_TOKEN: ${{ steps.correlation.outputs.run_token }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh run list -R "$AGENT_REPO" --workflow "$AGENT_WORKFLOW" \
              --json databaseId,displayTitle -L 40 \
              -q "[.[] | select(.displayTitle | contains(\"[$RUN_TOKEN]\"))][0].databaseId")
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Timed out waiting for the ExtRequest triage run to appear."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" -R "$AGENT_REPO" --interval 15

      - name: Download triage result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.await.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p result
          gh run download "$RUN_ID" -R "$AGENT_REPO" \
            -n bc-extrequest-triage-result \
            -D result

      - name: Apply triage result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(
              fs.readFileSync('result/triage-result.json', 'utf8')
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number('${{ inputs.issue_number }}');

            if (result.issue_number !== issue_number) {
              throw new Error(
                `Result is for issue #${result.issue_number}, expected #${issue_number}.`
              );
            }

            const managedLabels = [
              'missing-info',
              'agent-not-processable',
              'Finance',
              'SCM',
              'Integration',
              'event-request',
              'request-for-external',
              'enum-request',
              'extensibility-enhancement'
            ];
            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });
            const currentLabels = new Set(
              issue.data.labels.map(label =>
                typeof label === 'string' ? label : label.name
              )
            );

            for (const label of managedLabels) {
              if (currentLabels.has(label)) {
                await github.rest.issues.removeLabel({
                  owner,
                  repo,
                  issue_number,
                  name: label
                });
              }
            }

            for (const label of result.labels_to_set) {
              try {
                await github.rest.issues.addLabels({
                  owner,
                  repo,
                  issue_number,
                  labels: [label]
                });
              } catch (error) {
                core.warning(`Could not add label "${label}": ${error.message}`);
              }
            }

            if (result.comment_to_post) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: result.comment_to_post
              });
            }

            if (
              result.issue_state?.toLowerCase() === 'closed' &&
              issue.data.state !== 'closed'
            ) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }
