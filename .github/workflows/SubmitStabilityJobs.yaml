name: Submit Stability Job On Official Branches

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * 1" # Run all supported branches at 00:00 UTC on Monday
    - cron: "0 0 * * 0,2-6" # Run main and .x branches at 00:00 UTC Tuesday through Sunday

permissions: read-all

jobs:
  GetBranches:
    name: Get Official Branches
    if: github.repository_owner == 'microsoft'
    runs-on: ubuntu-latest
    outputs:
      officialBranches: ${{ steps.getOfficialBranches.outputs.branchesJson }}
    steps:
      - name: Select branch scope
        id: branchScope
        env:
          SCHEDULE: ${{ github.event.schedule }}
        shell: bash
        run: |
          if [[ "$SCHEDULE" == "0 0 * * 0,2-6" ]]; then
            echo 'include=["main", "releases/*.x"]' >> "$GITHUB_OUTPUT"
          else
            echo 'include=["main", "releases/*"]' >> "$GITHUB_OUTPUT"
          fi

      - name: Get Official Branches
        id: getOfficialBranches
        uses: microsoft/BCApps/.github/actions/GetGitBranches@main
        with:
          include: ${{ steps.branchScope.outputs.include }}

  SubmitStabilityJobs:
    name: "[${{ matrix.branch }}] Submit Stability Job"
    if: github.repository_owner == 'microsoft'
    runs-on: ubuntu-latest
    environment: Official-Build
    needs: GetBranches
    strategy:
      matrix:
        branch: ${{ fromJson(needs.GetBranches.outputs.officialBranches) }}
      fail-fast: false
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.PRIVATE_KEY }}

      - name: Submit Stability Job
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        uses: microsoft/BCApps/.github/actions/RunAutomation@main
        with:
          automations: SubmitStabilityJob
          targetBranch: ${{ matrix.branch }}
