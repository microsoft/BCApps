name: 'Extensibility Request Implement'

run-name: "${{ github.event_name == 'issues' && format('Implement extensibility request #{0}', github.event.issue.number) || github.event_name == 'push' && format('Record merged extensibility requests for {0}', github.sha) || format('Record extensibility request PR #{0}', github.event.pull_request.number) }}"

on:
  issues:
    types: [labeled]
  pull_request_target:
    types: [closed]
  push:
    branches: [main]

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

defaults:
  run:
    shell: pwsh

concurrency:
  group: bc-extrequest-${{ github.repository }}-${{ github.event.issue.number || github.event.pull_request.number || github.sha }}
  cancel-in-progress: false

env:
  EXT_REQ_KUSTO_CLUSTER_URI: ${{ vars.EXT_REQ_KUSTO_CLUSTER_URI }}
  EXT_REQ_KUSTO_DATABASE: ${{ vars.EXT_REQ_KUSTO_DATABASE }}
  EXT_REQ_KUSTO_IMPLEMENT_TABLE: ${{ vars.EXT_REQ_KUSTO_IMPLEMENT_TABLE }}

jobs:
  implement:
    if: >
      github.event_name == 'issues' &&
      (vars.EXT_REQ_IMPLEMENTATION_MODE == '' || vars.EXT_REQ_IMPLEMENTATION_MODE == 'per-issue') &&
      github.event.label.name == 'ext-ready-to-implement' &&
      github.event.issue.state == 'open' &&
      github.event.issue.type.name == 'Task'
    permissions:
      contents: write
      issues: read
      pull-requests: write
      id-token: write
      copilot-requests: write
    environment: extensibility-agent
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check telemetry configuration
        id: telemetry-config
        env:
          EXT_REQ_AZURE_CLIENT_ID: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          EXT_REQ_AZURE_TENANT_ID: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          EXT_REQ_AZURE_SUBSCRIPTION_ID: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}
        run: |
          $values = @(
            $env:EXT_REQ_AZURE_CLIENT_ID,
            $env:EXT_REQ_AZURE_TENANT_ID,
            $env:EXT_REQ_AZURE_SUBSCRIPTION_ID,
            $env:EXT_REQ_KUSTO_CLUSTER_URI,
            $env:EXT_REQ_KUSTO_DATABASE,
            $env:EXT_REQ_KUSTO_IMPLEMENT_TABLE
          )
          $enabled = -not ($values | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $enabled) {
            Write-Warning 'Telemetry configuration is incomplete. The implementation will continue without telemetry.'
          }

      - name: Azure login for telemetry
        id: azure-login
        if: steps.telemetry-config.outputs.enabled == 'true'
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}

      - name: Report telemetry login failure
        if: steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'failure'
        run: Write-Warning 'Azure login failed. The implementation will continue without telemetry.'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate skill
        run: |
          $requiredFiles = @(
            '.github/skills/bc-extrequest-implement/SKILL.md'
          )
          $missingFiles = @($requiredFiles | Where-Object { -not (Test-Path $_) })
          if ($missingFiles.Count -gt 0) {
            throw "Required skill files were not found: $($missingFiles -join ', ')."
          }

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EXTENSIBILITY_CLIENT_ID }}
          private-key: ${{ secrets.EXTENSIBILITY_TRIAGE_APP_PRIVATE_KEY }}

      - name: Configure GitHub App authentication
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh auth setup-git

      - name: Implement extensibility request
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          TELEMETRY_ENABLED: ${{ steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'success' }}
          EXT_REQ_AZURE_CLIENT_ID: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          EXT_REQ_AZURE_TENANT_ID: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          EXT_REQ_AZURE_SUBSCRIPTION_ID: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}
        run: |
          ./.github/scripts/bc-extrequest-implement/invoke-implementation.ps1 `
            -IssueNumber ([long]$env:ISSUE_NUMBER) `
            -IssueUrl $env:ISSUE_URL `
            -Repository $env:GITHUB_REPOSITORY `
            -Model 'gpt-5.6-sol' `
            -TelemetryEnabled ($env:TELEMETRY_ENABLED -eq 'true')

  discover-pr-outcomes:
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.merged == false &&
       (startsWith(github.event.pull_request.head.ref, 'bc-extrequest-implement/ext_issue-') ||
        startsWith(github.event.pull_request.head.ref, 'bc-extrequest-implement/team-')))
    runs-on: ubuntu-latest
    outputs:
      pull-requests: ${{ steps.discover.outputs.pull-requests }}
    steps:
      - name: Find pull request outcomes
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $eventPayload = Get-Content -Raw $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $pullRequests = @()
          if ($env:GITHUB_EVENT_NAME -eq 'pull_request_target') {
            $pullRequests = @(@{
              number = $eventPayload.pull_request.number
              headBranch = $eventPayload.pull_request.head.ref
            })
          } elseif (-not $eventPayload.deleted -and -not $eventPayload.created) {
            $comparisonJson = gh api --paginate --slurp `
              "repos/$env:GITHUB_REPOSITORY/compare/$($eventPayload.before)...$($eventPayload.after)?per_page=100"
            if ($LASTEXITCODE -ne 0) {
              throw 'Unable to read the pushed commits.'
            }
            $pendingCommitShas = @(
              ($comparisonJson | ConvertFrom-Json) |
                ForEach-Object { $_.commits.sha } |
                Sort-Object -Unique
            )
            for ($attempt = 1; $attempt -le 3 -and $pendingCommitShas.Count -gt 0; $attempt++) {
              $retryCommitShas = @()
              foreach ($commitSha in $pendingCommitShas) {
                $prsJson = gh api --paginate --slurp `
                  "repos/$env:GITHUB_REPOSITORY/commits/$commitSha/pulls?per_page=100"
                if ($LASTEXITCODE -ne 0) {
                  throw "Unable to read pull requests for commit $commitSha."
                }
                $mergedPullRequests = @(
                  ($prsJson | ConvertFrom-Json) | ForEach-Object { $_ } | Where-Object {
                    $_.merged_at -and
                    $_.base.ref -eq 'main' -and
                    $_.base.repo.full_name -eq $env:GITHUB_REPOSITORY -and
                    $_.merge_commit_sha -eq $commitSha
                  }
                )
                if ($mergedPullRequests.Count -eq 0) {
                  $retryCommitShas += $commitSha
                  continue
                }
                foreach ($pr in $mergedPullRequests) {
                  if ($pr.head.ref -match '^bc-extrequest-implement/(ext_issue-|team-)') {
                    $pullRequests += @{
                      number = $pr.number
                      headBranch = $pr.head.ref
                    }
                  }
                }
              }
              $pendingCommitShas = @($retryCommitShas)
              if ($pendingCommitShas.Count -gt 0 -and $attempt -lt 3) {
                Start-Sleep -Seconds 5
              }
            }
          }
          $pullRequests = @($pullRequests | Sort-Object -Property { $_.number } -Unique)
          $json = ConvertTo-Json -InputObject $pullRequests -Compress
          "pull-requests=$json" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  record-pr-outcome:
    needs: discover-pr-outcomes
    if: needs.discover-pr-outcomes.outputs.pull-requests != '[]'
    strategy:
      fail-fast: false
      matrix:
        pull-request: ${{ fromJSON(needs.discover-pr-outcomes.outputs.pull-requests) }}
    environment: extensibility-agent
    runs-on: ubuntu-latest

    steps:
      - name: Check telemetry configuration
        id: telemetry-config
        env:
          EXT_REQ_AZURE_CLIENT_ID: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          EXT_REQ_AZURE_TENANT_ID: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          EXT_REQ_AZURE_SUBSCRIPTION_ID: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}
        run: |
          $values = @(
            $env:EXT_REQ_AZURE_CLIENT_ID,
            $env:EXT_REQ_AZURE_TENANT_ID,
            $env:EXT_REQ_AZURE_SUBSCRIPTION_ID,
            $env:EXT_REQ_KUSTO_CLUSTER_URI,
            $env:EXT_REQ_KUSTO_DATABASE,
            $env:EXT_REQ_KUSTO_IMPLEMENT_TABLE
          )
          $enabled = -not ($values | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $enabled) {
            Write-Warning 'Telemetry configuration is incomplete. No PR telemetry will be sent.'
          }

      - name: Azure login for telemetry
        id: azure-login
        if: steps.telemetry-config.outputs.enabled == 'true'
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}

      - name: Report telemetry login failure
        if: steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'failure'
        run: Write-Warning 'Azure login failed. No PR telemetry will be sent.'

      - name: Checkout trusted workflow code
        if: steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'success'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Record pull request outcome
        if: steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PULL_REQUEST_NUMBER: ${{ matrix.pull-request.number }}
          HEAD_BRANCH: ${{ matrix.pull-request.headBranch }}
          EXT_REQ_AZURE_CLIENT_ID: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          EXT_REQ_AZURE_TENANT_ID: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          EXT_REQ_AZURE_SUBSCRIPTION_ID: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}
        run: |
          ./.github/scripts/bc-extrequest-implement/send-pr-outcome-telemetry.ps1 `
            -PullRequestNumber ([long]$env:PULL_REQUEST_NUMBER) `
            -HeadBranch $env:HEAD_BRANCH `
            -Repository $env:GITHUB_REPOSITORY
