name: BC ExtRequest Triage (Scheduled Dispatcher)

on:
  schedule:
    - cron: "0 1/6 * * *"
  workflow_dispatch:

permissions:
  issues: write
  contents: read

concurrency:
  group: bc-extrequest-triage-scheduled
  cancel-in-progress: false

env:
  AGENT_REPO: microsoft/BCAppsTriage
  AGENT_REPO_NAME: BCAppsTriage
  AGENT_WORKFLOW: bc-extrequest-triage-agent.yml
  AGENT_REF: main

jobs:
  discover_eligible_extensibility_requests:
    name: Discover eligible extensibility requests
    if: github.repository == 'microsoft/BCApps'
    runs-on: ubuntu-latest
    outputs:
      issues: ${{ steps.find-issues.outputs.issues }}
    steps:
      - name: Find eligible issues
        id: find-issues
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          now=$(date -u '+%s')
          cutoff_5min=$(date -u -d "@$((now - 300))" '+%Y-%m-%dT%H:%M:%SZ')
          cutoff_30d=$(date -u -d "@$((now - 2592000))" '+%Y-%m-%dT%H:%M:%SZ')

          new_issues=()
          updated_issues=()
          stale_issues=()

          classify_labels() {
            local labels=$1

            has_missing_info=false
            has_request_type=false
            has_agent_not_processable=false

            while IFS= read -r label; do
              [ -z "$label" ] && continue
              case "$label" in
                missing-info)
                  has_missing_info=true
                  ;;
                event-request|request-for-external|enum-request|extensibility-enhancement)
                  has_request_type=true
                  ;;
                agent-not-processable)
                  has_agent_not_processable=true
                  ;;
              esac
            done <<< "$labels"
          }

          while IFS= read -r issue; do
            number=$(echo "$issue" | jq -r '.number')
            created_at=$(echo "$issue" | jq -r '.created_at')
            updated_at=$(echo "$issue" | jq -r '.updated_at')
            label_names=$(echo "$issue" | jq -r '.labels[].name')

            classify_labels "$label_names"
            [ "$has_request_type" = "true" ] && continue
            [ "$has_agent_not_processable" = "true" ] && continue

            comments=$(gh api "repos/$GITHUB_REPOSITORY/issues/$number/comments" \
              --paginate | jq -cs 'add // []')

            if echo "$comments" | jq -e 'any(.[];
              ((.user.login // "") | ascii_downcase | endswith("[bot]") | not) and
              ((.body // "") | test("/not-accurate"; "i"))
            )' > /dev/null; then
              continue
            fi

            last_comment_author=$(echo "$comments" | jq -r 'last | .user.login // ""')
            last_comment_updated_at=$(echo "$comments" | jq -r 'last | .updated_at // ""')

            if [ "$has_missing_info" = "false" ]; then
              [[ "$created_at" < "$cutoff_5min" ]] || continue
              new_issues+=("$number")
            elif [[ "$updated_at" < "$cutoff_30d" ]]; then
              if [[ "${last_comment_author,,}" == *"[bot]" ]]; then
                stale_issues+=("$number")
              fi
            elif [[ "$updated_at" < "$cutoff_5min" ]]; then
              if [ -z "$last_comment_author" ] ||
                 [[ "${last_comment_author,,}" != *"[bot]" ]] ||
                 { [ -n "$last_comment_updated_at" ] &&
                   [[ "$updated_at" > "$last_comment_updated_at" ]]; }; then
                updated_issues+=("$number")
              fi
            fi
          done < <(gh api "repos/$GITHUB_REPOSITORY/issues" \
            --paginate -X GET \
            -f state=open \
            -f type=Task \
            -f per_page=100 \
            --jq '.[]')

          echo "::group::New issues (${#new_issues[@]})"
          [ "${#new_issues[@]}" -gt 0 ] && printf '  #%s\n' "${new_issues[@]}" || echo "  (none)"
          echo "::endgroup::"

          echo "::group::Updated issues (${#updated_issues[@]})"
          [ "${#updated_issues[@]}" -gt 0 ] && printf '  #%s\n' "${updated_issues[@]}" || echo "  (none)"
          echo "::endgroup::"

          echo "::group::Stale issues (${#stale_issues[@]})"
          [ "${#stale_issues[@]}" -gt 0 ] && printf '  #%s\n' "${stale_issues[@]}" || echo "  (none)"
          echo "::endgroup::"

          all_issues=("${new_issues[@]}" "${updated_issues[@]}" "${stale_issues[@]}")
          if [ "${#all_issues[@]}" -eq 0 ]; then
            echo "issues=[]" >> "$GITHUB_OUTPUT"
          else
            issues_json=$(printf '%s\n' "${all_issues[@]}" | jq -R 'tonumber' | jq -sc '.')
            echo "issues=$issues_json" >> "$GITHUB_OUTPUT"
          fi

  dispatch_and_apply_extensibility_request_triage:
    name: Triage BCApps issue #${{ matrix.issue }}
    needs: discover_eligible_extensibility_requests
    if: >-
      needs.discover_eligible_extensibility_requests.outputs.issues != '' &&
      needs.discover_eligible_extensibility_requests.outputs.issues != '[]'
    runs-on: ubuntu-latest
    environment: triage
    strategy:
      fail-fast: false
      matrix:
        issue: ${{ fromJson(needs.discover_eligible_extensibility_requests.outputs.issues) }}
    steps:
      - name: Create correlation token
        id: correlation
        run: echo "run_token=$(uuidgen)" >> "$GITHUB_OUTPUT"

      - name: Mint token for BCAppsTriage
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.TRIAGE_APP_ID }}
          private-key: ${{ secrets.TRIAGE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ env.AGENT_REPO_NAME }}

      - name: Start ExtRequest triage
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          ISSUE_NUMBER: ${{ matrix.issue }}
          RUN_TOKEN: ${{ steps.correlation.outputs.run_token }}
        run: |
          set -euo pipefail
          gh workflow run "$AGENT_WORKFLOW" -R "$AGENT_REPO" --ref "$AGENT_REF" \
            -f issue_number="$ISSUE_NUMBER" \
            -f run_token="$RUN_TOKEN"

      - name: Await ExtRequest triage
        id: await
        timeout-minutes: 30
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_TOKEN: ${{ steps.correlation.outputs.run_token }}
        run: |
          set -euo pipefail
          run_id=""
          for i in $(seq 1 30); do
            run_id=$(gh run list -R "$AGENT_REPO" --workflow "$AGENT_WORKFLOW" \
              --json databaseId,displayTitle -L 100 \
              -q "[.[] | select(.displayTitle | contains(\"[$RUN_TOKEN]\"))][0].databaseId")
            if [ -n "$run_id" ] && [ "$run_id" != "null" ]; then
              break
            fi
            sleep 10
          done

          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "::error::Timed out waiting for the ExtRequest triage run to appear."
            exit 1
          fi

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" -R "$AGENT_REPO" --interval 15

      - name: Download triage result
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.await.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p result
          gh run download "$RUN_ID" -R "$AGENT_REPO" \
            -n bc-extrequest-triage-result \
            -D result

      - name: Apply triage result
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          ISSUE_NUMBER: ${{ matrix.issue }}
        with:
          script: |
            const fs = require('fs');
            const result = JSON.parse(
              fs.readFileSync('result/triage-result.json', 'utf8')
            );
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const issue_number = Number(process.env.ISSUE_NUMBER);

            if (result.issue_number !== issue_number) {
              throw new Error(
                `Result is for issue #${result.issue_number}, expected #${issue_number}.`
              );
            }

            if (result.skipped) {
              core.info(`Issue #${issue_number} was skipped: ${result.reason}`);
              return;
            }

            const issue = await github.rest.issues.get({
              owner,
              repo,
              issue_number
            });
            const currentLabels = issue.data.labels.map(label =>
              typeof label === 'string' ? label : label.name
            );
            const desiredLabels = [...new Set(result.labels_to_set ?? [])];

            if (
              desiredLabels.length > 0 &&
              (
                currentLabels.length !== desiredLabels.length ||
                currentLabels.some(label => !desiredLabels.includes(label))
              )
            ) {
              await github.rest.issues.setLabels({
                owner,
                repo,
                issue_number,
                labels: desiredLabels
              });
            }

            if (result.comment_to_post) {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body: result.comment_to_post
              });
            }

            if (
              result.issue_state?.toLowerCase() === 'closed' &&
              issue.data.state !== 'closed'
            ) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number,
                state: 'closed',
                state_reason: 'not_planned'
              });
            }