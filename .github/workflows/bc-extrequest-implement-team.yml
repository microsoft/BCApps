name: 'Extensibility Request Team Batch'

run-name: >-
  ${{ github.event_name == 'schedule' &&
      'Implement daily extensibility request team batches' ||
      format('Implement extensibility requests for {0}', inputs.team) }}

on:
  schedule:
    - cron: '10 18 * * 1-5'
      timezone: 'Europe/Copenhagen'
  workflow_dispatch:
    inputs:
      team:
        description: Team to process
        required: true
        type: choice
        default: all
        options:
          - all
          - Finance
          - SCM
          - Integrations

permissions:
  contents: read
  issues: read
  pull-requests: read
  id-token: write

defaults:
  run:
    shell: pwsh

concurrency:
  group: bc-extrequest-team-batch-${{ github.repository }}
  cancel-in-progress: false

env:
  EXT_REQ_KUSTO_CLUSTER_URI: ${{ vars.EXT_REQ_KUSTO_CLUSTER_URI }}
  EXT_REQ_KUSTO_DATABASE: ${{ vars.EXT_REQ_KUSTO_DATABASE }}
  EXT_REQ_KUSTO_IMPLEMENT_TABLE: ${{ vars.EXT_REQ_KUSTO_IMPLEMENT_TABLE }}

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' || vars.EXT_REQ_IMPLEMENTATION_MODE == 'per-team'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - name: Prepare team matrix
        id: matrix
        env:
          SELECTED_TEAM: ${{ inputs.team || 'all' }}
        run: |
          $teams = @(
            @{ team = 'Finance'; label = 'Team: Finance'; slug = 'finance' },
            @{ team = 'SCM'; label = 'Team: SCM'; slug = 'scm' },
            @{ team = 'Integrations'; label = 'Team: Integrations'; slug = 'integrations' }
          )
          if ($env:SELECTED_TEAM -ne 'all') {
            $teams = @($teams | Where-Object { $_.team -eq $env:SELECTED_TEAM })
          }
          if ($teams.Count -eq 0) {
            throw "Unsupported team '$env:SELECTED_TEAM'."
          }
          $matrix = @{ include = $teams } | ConvertTo-Json -Compress
          "value=$matrix" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  implement-team:
    needs: prepare
    permissions:
      contents: write
      issues: read
      pull-requests: write
      id-token: write
      copilot-requests: write
    environment: extensibility-agent
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.prepare.outputs.matrix) }}

    steps:
      - name: Check telemetry configuration
        id: telemetry-config
        env:
          EXT_REQ_AZURE_CLIENT_ID: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          EXT_REQ_AZURE_TENANT_ID: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          EXT_REQ_AZURE_SUBSCRIPTION_ID: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}
        run: |
          $values = @(
            $env:EXT_REQ_AZURE_CLIENT_ID,
            $env:EXT_REQ_AZURE_TENANT_ID,
            $env:EXT_REQ_AZURE_SUBSCRIPTION_ID,
            $env:EXT_REQ_KUSTO_CLUSTER_URI,
            $env:EXT_REQ_KUSTO_DATABASE,
            $env:EXT_REQ_KUSTO_IMPLEMENT_TABLE
          )
          $enabled = -not ($values | Where-Object { [string]::IsNullOrWhiteSpace($_) })
          "enabled=$($enabled.ToString().ToLowerInvariant())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if (-not $enabled) {
            Write-Warning 'Telemetry configuration is incomplete. The implementation will continue without telemetry.'
          }

      - name: Azure login for telemetry
        id: azure-login
        if: steps.telemetry-config.outputs.enabled == 'true'
        continue-on-error: true
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c # v3.0.2
        with:
          client-id: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}

      - name: Report telemetry login failure
        if: steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'failure'
        run: Write-Warning 'Azure login failed. The implementation will continue without telemetry.'

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate skill
        run: |
          if (-not (Test-Path '.github/skills/bc-extrequest-implement/SKILL.md')) {
            throw 'Skill .github/skills/bc-extrequest-implement/SKILL.md was not found.'
          }

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Install Copilot CLI
        run: npm install --global @github/copilot

      - name: Implement team batch
        id: implement
        env:
          COPILOT_GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
          TEAM: ${{ matrix.team }}
          TEAM_LABEL: ${{ matrix.label }}
          TEAM_SLUG: ${{ matrix.slug }}
          TELEMETRY_ENABLED: ${{ steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'success' }}
          EXT_REQ_AZURE_CLIENT_ID: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          EXT_REQ_AZURE_TENANT_ID: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          EXT_REQ_AZURE_SUBSCRIPTION_ID: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}
        run: |
          $batchTimeZone = [TimeZoneInfo]::FindSystemTimeZoneById('Europe/Copenhagen')
          $batchDate = [TimeZoneInfo]::ConvertTimeFromUtc([DateTime]::UtcNow, $batchTimeZone).ToString('yyyy-MM-dd')
          $statePath = Join-Path $env:RUNNER_TEMP "bc-extrequest-$($env:TEAM_SLUG)-state.json"
          ./.github/scripts/bc-extrequest-implement/invoke-team-implementation.ps1 `
            -Team $env:TEAM `
            -TeamLabel $env:TEAM_LABEL `
            -TeamSlug $env:TEAM_SLUG `
            -BatchDate $batchDate `
            -Repository $env:GITHUB_REPOSITORY `
            -StatePath $statePath `
            -Limit 10 `
            -Model 'gpt-5.6-sol' `
            -TelemetryEnabled ($env:TELEMETRY_ENABLED -eq 'true')
          "has-work=$((Test-Path $statePath).ToString().ToLowerInvariant())" |
            Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Mint fresh token for publication
        if: steps.implement.outputs.has-work == 'true'
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ vars.EXTENSIBILITY_CLIENT_ID }}
          private-key: ${{ secrets.EXTENSIBILITY_TRIAGE_APP_PRIVATE_KEY }}

      - name: Publish team batch
        if: steps.implement.outputs.has-work == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          TEAM_SLUG: ${{ matrix.slug }}
          TELEMETRY_ENABLED: ${{ steps.telemetry-config.outputs.enabled == 'true' && steps.azure-login.outcome == 'success' }}
          EXT_REQ_AZURE_CLIENT_ID: ${{ vars.EXT_REQ_AZURE_CLIENT_ID || secrets.EXT_REQ_AZURE_CLIENT_ID }}
          EXT_REQ_AZURE_TENANT_ID: ${{ vars.EXT_REQ_AZURE_TENANT_ID || secrets.EXT_REQ_AZURE_TENANT_ID }}
          EXT_REQ_AZURE_SUBSCRIPTION_ID: ${{ vars.EXT_REQ_AZURE_SUBSCRIPTION_ID || secrets.EXT_REQ_AZURE_SUBSCRIPTION_ID }}
        run: |
          $statePath = Join-Path $env:RUNNER_TEMP "bc-extrequest-$($env:TEAM_SLUG)-state.json"
          ./.github/scripts/bc-extrequest-implement/finalize-team-implementation.ps1 `
            -StatePath $statePath `
            -TelemetryEnabled ($env:TELEMETRY_ENABLED -eq 'true')
