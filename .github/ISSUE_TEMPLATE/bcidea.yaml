name: Feature contribution
description: Propose a feature you intend to implement.
title: "[Feature]: "
labels: ["BCIdea"]
type: 'Feature'
body:
  - type: markdown
    attributes:
      value: |
        Thanks for proposing a feature contribution!

        ⚠️⚠️ BEFORE WE GET STARTED ⚠️⚠️
        Please only create a feature contribution issue if you intend to implement it yourself. If you are not planning to implement the feature yourself, please go to https://aka.ms/bcideas to suggest or upvote it instead.

        A BC Idea link is optional. An existing idea, especially one with many votes, can help demonstrate demand, but you do not need to register an idea to propose a contribution.

        Before you create a new issue please:
        🔎 Search existing issues to avoid creating duplicates.

        Read more about what and how to contribute in the CONTRIBUTING document of this repository: https://github.com/microsoft/BCApps/blob/main/CONTRIBUTING.md. Wait for Microsoft to approve your issue before starting implementation.

  - type: input
    id: bcidea
    attributes:
      label: BC Idea Link (optional)
      description: If a related BC Idea exists, link it here to help demonstrate demand.
      placeholder: ex. https://experience.dynamics.com/ideas/idea/?ideaid=123456
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: Problem statement
      description: Describe the problem, who it affects, and why it needs to be addressed.
      placeholder: What problem would this feature solve?
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: Describe the feature you intend to implement and how it would solve the problem.
      placeholder: What would you change, and what would users be able to do?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: I will provide the implementation for this feature
      description: |
        To confirm that you intend to implement this feature once approved, select this checkbox. Thanks for contributing.
      options:
        - label: I will provide the implementation for this feature
          required: true
